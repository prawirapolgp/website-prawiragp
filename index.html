<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepolisian Garuda Prime RP - PRAWIRA</title>
    <link rel="stylesheet" href="./Style/styleindex.css">
    
    <!-- SDK Firebase CDN (Wajib) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            
            <div class="logo">
                <div class="logo-icon">
                    <img src="./logo/PRAWIRA.png" alt="Logo Prawira"> <!-- Ganti src sesuai path logo Anda -->
                </div>
            </div>

            <h1>DATA EVIDENCE</h1>
            <p class="subtitle">Kepolisian Garuda Prime RP</p>

            <form id="loginForm" onsubmit="event.preventDefault(); prosesLogin();">
    
    <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukkan username" required>
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <div class="password-box">
            <input type="password" id="password" placeholder="Masukkan password" required>
            <button type="button" id="togglePassword" onclick="togglePasswordVisibility()">👁️️</button>
        </div>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <button type="submit" id="btnLogin" class="login-button">LOGIN</button>

</form>

            <div class="login-footer">
                Prawira | Xyanz © 2026
            </div>

        </div>
    </div>

    <script src="./JavaScript/scriptindex.js"></script>
</body>
</html>
