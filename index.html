<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepolisian Garuda Prime RP - PRAWIRA</title>

    <link rel="stylesheet" href="./Style/styleindex.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <div class="logo-icon">
                    <img src="./logo/PRAWIRA.png" alt="Logo PRAWIRA">
                </div>
            </div>

            <h1>DATA EVIDENCE</h1>
            <p class="subtitle">Kepolisian Garuda Prime RP</p>

            <form id="loginForm">

                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Masukkan username" autocomplete="off" required>
                </div>

                <div class="input-group">
                    <label>Password</label>

                    <div class="password-box">
                        <input type="password" id="password" placeholder="Masukkan password" required>

                        <button type="button" id="togglePassword">
                            👁
                        </button>
                    </div>
                </div>

                <div id="errorMessage" class="error-message"></div>

                <button type="submit" class="login-button">
                    LOGIN
                </button>

            </form>

            <div class="login-footer">
                <span>Prawira | Xyanz © 2026</span>
            </div>

        </div>

    </div>

    <script src="./Javascript/scriptindex.js"></script>

</body>

</html>
